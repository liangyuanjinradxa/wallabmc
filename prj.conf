# Respect flash partition layout
CONFIG_USE_DT_CODE_PARTITION=y

# Kernel options
CONFIG_BOOT_BANNER=n # Do our own banner
CONFIG_EARLY_CONSOLE=y
CONFIG_INIT_STACKS=y

CONFIG_POSIX_API=y

# Net debug
#CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
#CONFIG_SNTP_LOG_LEVEL_DBG=y
#CONFIG_NET_LOG=y

CONFIG_RTC=y

# Logging
CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_PRINTK=n
# CONFIG_NET_LOG=y # ~10kB flash
CONFIG_PHY_LOG_LEVEL_WRN=y

# Generic networking options
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y

# IP address options
# 2 addresses so we can have a DHCP and an overridable static */
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
#CONFIG_DNS_RESOLVER=y # This makes telnet console hang?
# Hostname will be registered with DHCP so if the network supports it,
# it will be the DNS name too. UNIQUE=y appends a random UUID to the
# end of HOSTNAME, you will need to watch the console to get this, or
# give yourself a unique hostname.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="wallabmc"
# Don't want to append a unique string because that makes it hard to
# find.
#CONFIG_NET_HOSTNAME_UNIQUE=y
# default / no-DHCP IP address
#CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.2.55"

# `date set` does not set the RTC which would be confusing, so
# disable it. We supply `bmc time` commands.
CONFIG_DATE_SHELL=n
# local/network shell
CONFIG_KERNEL_SHELL=n # ~5kB flash
#CONFIG_SHELL_TAB=y
#CONFIG_NET_SHELL=y # ~40kB flash

# GPIO options
CONFIG_GPIO=y

### Storage ###
CONFIG_PERSISTENT_STORAGE=y

# Enable serial shell backend (for USB/serial console input)
CONFIG_SHELL_BACKEND_SERIAL=y
# Increase RX ring buffer so typing doesn't overflow (default 64 is too small)
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512

# Websocket default prompt (does not enable anything on it's own)
CONFIG_SHELL_WEBSOCKET_PROMPT="bmc:~$ "

# Larger net buffers = fewer buffers per frame (same ~32KB total)
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_DATA_SIZE=256
# Slightly larger window for more data in flight
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
# HW checksum offload and async TX for better CPU efficiency
CONFIG_ETH_STM32_HW_CHECKSUM=y
CONFIG_ETH_STM32_HAL_TX_ASYNC=y

# Increase HTTP client buffer (16KB) and reduce max clients to save RAM
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=16384
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
